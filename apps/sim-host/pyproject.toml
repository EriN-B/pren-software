[project]
name = "dog-sim-host"
version = "0.1.0"
description = "Simulator host: runs the dog's brain with the simulator adapter; the web simulator connects to it."
requires-python = ">=3.12"
dependencies = [
    "dog-protocol",
    "mujoco>=4.0.1",
    "websockets>=17.3",
]

[project.optional-dependencies]
# The detector test bench (dog_sim_host.bench): the core's detector needs these.
bench = [
    "ultralytics==8.4.197",  # as apps/robot/uv.lock
    "ncnn",
    "opencv-python-headless",
    # Listed so the CPU-only source in the root pyproject applies (Ultralytics pulls them).
    "torch",
    "torchvision",
]

[tool.uv.sources]
dog-protocol = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project.scripts]
dog-sim = "dog_sim_host.app:main"
