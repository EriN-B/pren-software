[project]
name = "dog-perception"
version = "0.1.0"
description = "Voice and gesture recognisers."
requires-python = ">=3.12"
dependencies = ["dog-core"]

[project.optional-dependencies]
vosk = ["vosk"]
mediapipe = ["mediapipe"]
yolo = ["ultralytics"]

[tool.uv.sources]
dog-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
