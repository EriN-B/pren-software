[project]
name = "dog-core"
version = "0.1.0"
description = "Shared messages, ports and clock. Standard library only."
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "mediapipe>=1.2.0",
    "opencv-python>=5.0.0.93",
    "python-statemachine>=3.2.2",
    "scikit-learn>=1.9.1",
    "sounddevice>=0.5.6",
    "ultralytics>=8.4.197",
    "vosk==0.3.42",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
