[project]
name = "pren-software"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff", "pytest", "import-linter"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
# test files share names across packages
addopts = "--import-mode=importlib"
