[project]
name = "pren-software"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["dog-protocol", "dog-sim-host"]

[dependency-groups]
dev = ["ruff", "pytest", "import-linter"]
docs = [
    "mkdocs-material>=9.8.1",
    "mkdocstrings[python]>=1.0.8",
]

[tool.uv.workspace]
members = ["packages/*", "apps/sim-host"]
# apps/robot is its own workspace with the core's ML libraries (see its pyproject.toml);
# the simulator loads that core from .venv-core (apps/sim-host/scripts/core-env.sh).

[tool.uv.sources]
dog-protocol = { workspace = true }
dog-sim-host = { workspace = true }

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
# apps/robot has its own environment and runs its own tests
testpaths = ["packages", "apps/sim-host"]
# test files share names across packages
addopts = "--import-mode=importlib"
